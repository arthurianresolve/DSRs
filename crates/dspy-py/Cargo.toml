[package]
name = "dspy-py"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
description = "DSRs structured-output adapter for Python DSPy"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[lib]
name = "_dsrs_dspy"
crate-type = ["cdylib"]

[dependencies]
dspy-rs = { path = "../dspy-rs", default-features = false }
pyo3 = { version = "0.28.3", features = ["abi3-py310"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["preserve_order"] }
